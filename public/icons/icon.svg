<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090c15"/>
      <stop offset="50%" stop-color="#111625"/>
      <stop offset="100%" stop-color="#18132b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="506" height="506" x="3" y="3" rx="125" fill="none" stroke="url(#primaryGrad)" stroke-width="6" stroke-opacity="0.5"/>

  <!-- Glowing emblem -->
  <g transform="translate(106, 106)" filter="url(#glow)">
    <!-- Play Triangle combined with wings -->
    <path d="M70 50 L250 150 L70 250 Z" fill="url(#primaryGrad)"/>
    <circle cx="210" cy="80" r="24" fill="#06b6d4"/>
    <circle cx="70" cy="50" r="16" fill="#8b5cf6"/>
    <circle cx="70" cy="250" r="16" fill="#8b5cf6"/>
    <path d="M120 110 L190 150 L120 190 Z" fill="#ffffff" fill-opacity="0.9"/>
  </g>
</svg>
