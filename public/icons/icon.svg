<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="repuBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="repuGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="128" fill="url(#repuBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.6"/>

  <!-- Centered 5-Star Shield Badge -->
  <g transform="translate(256, 256)" filter="url(#repuGlow)">
    <!-- Golden Star -->
    <path d="M0 -150 L46 -40 L165 -40 L70 35 L106 148 L0 75 L-106 148 L-70 35 L-165 -40 L-46 -40 Z" fill="url(#goldGrad)"/>
    <!-- Center Sparkle -->
    <circle cx="0" cy="0" r="28" fill="#ffffff" fill-opacity="0.95"/>
  </g>
</svg>
